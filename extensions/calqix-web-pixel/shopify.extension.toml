name = "calqix-web-pixel"
type = "web_pixel_extension"
uid = "9161ad4c-208f-1b92-a152-f766e57f0c071e67e21d"

runtime_context = "strict"

[settings]
type = "object"

[settings.fields.endpoint]
name = "CAPI endpoint"
description = "Checkout event endpoint that receives native Shopify Web Pixel events."
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]

[settings.fields.healthEndpoint]
name = "Health endpoint"
description = "Diagnostic endpoint used to verify that the native web pixel is firing."
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]

[settings.fields.pixelId]
name = "Meta Pixel ID"
description = "Meta Pixel ID used for diagnostics and parity checks."
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]
