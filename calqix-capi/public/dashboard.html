<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0;url=/">
  <meta name="robots" content="noindex">
  <meta name="calqix-dashboard-layout" content="redirect-to-tracking-intelligence-2026-05-15">
  <title>CALQIX Tracking Intelligence</title>
  <style>
    :root {
      --ink: #102033;
      --muted: #65758b;
      --navy: #102033;
      --gold: #ecd98d;
      --line: #dbe5ee;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #eef5f8 0%, #f8fafb 48%, #eef4f0 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    main {
      width: min(520px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 22px 60px rgba(20, 38, 60, .14);
      padding: 24px;
    }
    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--navy);
    }
    h1 {
      margin: 18px 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold), #c9a84c);
      color: var(--navy);
      font-weight: 800;
      text-decoration: none;
      padding: 10px 16px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">CALQIX</div>
    <h1>Tracking Intelligence is verplaatst</h1>
    <p>Deze oude Radar-route verwijst nu altijd naar de nieuwe dashboardweergave, zodat er geen tweede layout meer kan terugkomen.</p>
    <a href="/">Open dashboard</a>
  </main>
  <script>
    window.location.replace('/');
  </script>
</body>
</html>
